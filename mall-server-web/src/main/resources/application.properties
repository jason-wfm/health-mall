###################################### forest配置 ####################################
# 请求超时时间，单位为毫秒（默认为 3000）
forest.timeout=180000
# 连接超时时间，单位为毫秒（默认为 timeout）
forest.connect-timeout=180000
# 数据读取超时时间，单位为毫秒（默认为 timeout）
forest.read-timeout=180000
# 请求失败后重试次数（默认为 0 次不重试）
forest.max-retry-count=0 
# 单向验证的HTTPS的默认SSL协议（默认为 SSLv3）
forest.ssl-protocol=SSLv3
# 打开或关闭日志（默认为 true）
forest.logEnabled=true
# 打开/关闭Forest请求日志（默认为 true）
forest.log-request=true
# 打开/关闭Forest响应状态日志（默认为 true）
forest.log-response-status=true
# 打开/关闭Forest响应内容日志（默认为 false）
forest.log-response-content=true
# his 部署地址
forest.variables.his.baseUrl=
################################ beetsql配置 ###################################
beetlsql.sqlManagers=masterSqlManager
# 多数据源时动态切换策略
beetlsql.dynamicSwitchingStrategy=
### masterSqlManager ###
# 默认是true，即向控制台输出执行时候的sql，参数，执行时间，以及执行的位置，每次修改sql文件的时候，自动检测sql文件修改
# 生产环境配置成 false,提高性能
beetlsql.masterSqlManager.dev=true
# 默认是org.beetl.sql.core.UnderlinedNameConversion,能将下划线分割的数据库命名风格转化为java驼峰命名风格，
beetlsql.masterSqlManager.nameConversion=org.beetl.sql.core.UnderlinedNameConversion
beetlsql.masterSqlManager.basePackage=com.fp.hiop
beetlsql.masterSqlManager.daoSuffix=Dao
# sql 文件的位置
beetlsql.masterSqlManager.sqlPath=sql/mysql
beetlsql.masterSqlManager.sqlFileCharset=UTF-8
beetlsql.masterSqlManager.dbStyle=org.beetl.sql.core.db.MySqlStyle
beetlsql.masterSqlManager.ds=masterDatasource
################### 数据库连接配置 #################
